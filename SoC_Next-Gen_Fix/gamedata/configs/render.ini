;================================================================================
; SoC Next-Gen Fix - Настройки рендера
; Реалистичная графика для S.T.A.L.K.E.R.: Shadow of Chernobyl
; Совместимо с оригинальным X-Ray движком и OGSR/OpenXRay
;================================================================================

[render]
; --- Базовые настройки ---
r2_sun                    = on           ; динамическое солнце
r2_sun_depth              = on           ; глубина теней солнца
r2_sun_quality            = 3            ; качество теней солнца (1-4)
r2_steep_parallax         = on           ; параллакс текстур
r2_detail_bump            = on           ; детальное bump-картирование
r2_gloss                  = on           ; глянцевые поверхности (PBR)
r2_dof_enable             = on           ; глубина резкости
r2_dof_value              = 0.85         ; сила эффекта DoF

; --- Тени ---
r2_shadow_filter          = 3            ; фильтр теней (1-PCF, 3-VSM)
r2_pcsm_cache_size        = 2048         ; размер кэша теней
r2_smap_size              = 2048         ; размер карты теней
r2_ls_flags               = 0x7f         ; флаги освещения

; --- Трава и растительность ---
r__detail_density         = 1.2          ; плотность травы (0.5-2.0)
r__detail_radius          = 150          ; радиус прорисовки травы
r__vis_distance           = 1.0          ; дистанция видимости объектов

; --- Вода ---
r2_water_reflect          = on           ; отражения в воде
r2_water_reflect_quality  = 2            ; качество отражений (1-2)
r2_water_transparency     = 0.6          ; прозрачность воды

; --- Постобработка ---
r2_aa                     = 3            ; сглаживание (0-off, 1-FXAA, 3-SMAA)
r2_aa_always              = on           ; всегда включать сглаживание
r2_gb_sharpen_value       = 0.35         ; резкость изображения
r2_ssao                   = on           ; SSAO (затенение окружения)
r2_ssao_quality           = 2            ; качество SSAO (1-HBAO, 2-GTAO)
r2_ssao_half_res          = off          ; полное разрешение SSAO
r2_gi                     = on           ; глобальное освещение
r2_gi_quality             = 2            ; качество GI (1-2)

; --- God Rays (лучи света) ---
r2_sun_shafts             = on           ; объемные лучи света
r2_sun_shafts_quality     = 2            ; качество лучей (1-2)
r2_sun_shafts_intensity   = 0.75         ; интенсивность лучей

; --- Wet Surfaces (мокрые поверхности) ---
r2_rain_wet_surfaces      = on           ; эффект мокрых поверхностей
r2_rain_wetness_intensity = 0.8          ; интенсивность мокрого эффекта
r2_rain_drops_on_surface  = on           ; капли дождя на экране

; --- Bloom и свет ---
r2_bloom_enable           = on           ; эффект свечения
r2_bloom_threshold        = 0.7          ; порог свечения
r2_bloom_intensity        = 0.6          ; интенсивность bloom
r2_light_blob_quality     = 2            ; качество источников света
r2_flare_enable           = on           ; блики от солнца/фонарей
r2_flare_quality          = 2            ; качество бликов

; --- Туман и атмосфера ---
fog_density               = 0.008        ; плотность тумана
fog_far                   = 300          ; дальняя граница тумана
fog_color                 = 0.7, 0.75, 0.8 ; цвет тумана (R,G,B)

; --- Лимиты видеопамяти (автоматически) ---
vid_vram_limit            = 0            ; 0 = автоопределение
texture_lod               = 0            ; уровень детализации текстур (0-max)

; --- Прочие эффекты ---
r2_mblur                  = 0.35         ; размытие в движении
r2_test_nodistort         = off          ; дисторшн эффекты
r2_exp_dump               = off          ; отладочный дамп

;================================================================================
; ПРИМЕЧАНИЕ: Для переключения между пресетами используйте отдельные файлы:
; - render_low.ltx (для слабых ПК)
; - render_medium.ltx (для средних ПК)  
; - render_high.ltx (для мощных ПК)
; Или меню "Next_Gen Графика" в игре (клавиша ~ -> lua ui_graphic_menu.open_menu())
;================================================================================
