;===========================================================================
; SoC Next-Gen Fix - Render Configuration
; Оптимизация рендера для стабильности и производительности
;===========================================================================

[render]
;----------------------------------------------------------------------------
; Основные настройки рендера
;----------------------------------------------------------------------------

; Тип рендера (R1, R2, R3, R4)
; R1 - минимальная графика, максимальная производительность
; R2 - баланс качества и производительности
; R3 - улучшенная графика (DX10)
; R4 - максимальная графика (DX11)
r__renderer_preference    R3

;----------------------------------------------------------------------------
; Оптимизация памяти и ресурсов
;----------------------------------------------------------------------------

; Автоматическая очистка неиспользуемых текстур
r__cleanup_unused_textures TRUE

; Максимум текстур в памяти (MB)
; Уменьшите значение при нехватке видеопамяти
r__texture_memory_limit   2048

; Кэширование текстур для ускорения загрузки
r__texture_cache          TRUE

; Предзагрузка критических текстур
r__preload_critical_textures TRUE

;----------------------------------------------------------------------------
; Детализация и дальность прорисовки
;----------------------------------------------------------------------------

; Плотность детализации объектов (0.1 - 1.0)
; Меньше = лучше производительность, больше = красивее
r__detail_density         0.6

; Дистанция видимости (0.3 - 1.0)
; Влияет на дальность прорисовки объектов
r__vis_distance           0.75

; Дальность прорисовки травы
r__grass_distance         0.7

; Качество LOD (Level of Detail)
; 0 - минимальное, 1 - максимальное
r__lod_quality            0.8

;----------------------------------------------------------------------------
; Тени и освещение
;----------------------------------------------------------------------------

; Качество теней (0 - отключено, 1-3 - качество)
r__shadow_quality         2

; Дистанция теней (0.3 - 1.0)
r__shadow_distance        0.7

; Мягкость теней (включает PCF фильтрацию)
r__soft_shadows           TRUE

; God Rays (лучи света)
r__godrays_enabled        TRUE
r__godrays_quality        2

;----------------------------------------------------------------------------
; Постобработка и эффекты
;----------------------------------------------------------------------------

; Bloom эффект (свечение)
r__bloom_enabled          TRUE
r__bloom_intensity        0.6

; Depth of Field (размытие фона)
; Отключено для производительности
r__dof_enabled            FALSE

; Motion Blur (размытие в движении)
; Отключено для производительности
r__motion_blur            FALSE

; SSAO (затенение в углах)
r__ssao_enabled           TRUE
r__ssao_quality           2

; Антиалиасинг (сглаживание)
; FXAA - быстрое, MSAA - качественное но требовательное
r__antialiasing           FXAA

;----------------------------------------------------------------------------
; Эффекты погоды
;----------------------------------------------------------------------------

; Объемный туман
r__volumetric_fog         TRUE
r__fog_density            0.5

; Дождь и капли на экране
r__rain_drops             TRUE
r__wet_surfaces           TRUE

; Отражения в лужах
r__puddle_reflections     TRUE

;----------------------------------------------------------------------------
; Оптимизация для многопоточности
;----------------------------------------------------------------------------

; Включение многопоточного рендеринга
r__multithreading         TRUE

; Количество потоков для рендеринга
; 0 - автоопределение
r__render_threads           0

; Асинхронная загрузка ресурсов
r__async_loading          TRUE

;----------------------------------------------------------------------------
; Дополнительные оптимизации
;----------------------------------------------------------------------------

; Время жизни следов от пуль (кадры)
; Уменьшите для лучшей производительности
r__wallmark_ttl           100

; Скриншоты в формате TGA (FALSE = JPG, быстрее)
r__tf_screenshot          FALSE

; Вертикальная синхронизация
; Отключите для большего FPS (может быть tearing)
r__vsync                  FALSE

; Ограничение FPS (0 - без ограничений)
r__fps_limit              0

;----------------------------------------------------------------------------
; Настройки для разных уровней производительности
;----------------------------------------------------------------------------

[render_low]
; Для слабых ПК (2-4 GB RAM, старые видеокарты)
r__detail_density         0.3
r__vis_distance           0.5
r__shadow_quality         1
r__godrays_enabled        FALSE
r__ssao_enabled           FALSE
r__bloom_enabled          FALSE
r__multithreading         TRUE
r__texture_memory_limit   1024

[render_medium]
; Для средних ПК (8 GB RAM, GTX 1050/1060)
r__detail_density         0.5
r__vis_distance           0.7
r__shadow_quality         2
r__godrays_enabled        TRUE
r__ssao_enabled           TRUE
r__bloom_enabled          TRUE
r__multithreading         TRUE
r__texture_memory_limit   2048

[render_high]
; Для мощных ПК (16+ GB RAM, RTX 2060+)
r__detail_density         0.8
r__vis_distance           0.9
r__shadow_quality         3
r__godrays_enabled        TRUE
r__ssao_enabled           TRUE
r__bloom_enabled          TRUE
r__multithreading         TRUE
r__texture_memory_limit   4096

[render_ultra]
; Для топовых систем (32+ GB RAM, RTX 3080+)
r__detail_density         1.0
r__vis_distance           1.0
r__shadow_quality         3
r__godrays_enabled        TRUE
r__ssao_enabled           TRUE
r__bloom_enabled          TRUE
r__multithreading         TRUE
r__texture_memory_limit   8192

;===========================================================================
; Конец конфигурации рендера
;===========================================================================
